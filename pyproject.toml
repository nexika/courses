[project]
name = "nexika-courses"
version = "0.1.0"
description = "Verified courses for Nexika's tutor. Tooling is stdlib-only; content ships as plain files."
requires-python = ">=3.10"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/test_tools.py" = ["E501"]  # bilingual sample lessons are naturally long lines
